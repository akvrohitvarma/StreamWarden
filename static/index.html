<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamWarden</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="sidebar">
  <div class="logo">StreamWarden</div>
  <div class="status" id="conn-status">● Connecting...</div>
  <nav>
    <a href="#" data-page="vod" class="active" onclick="nav('vod')"><span>VOD Library</span></a>
    <a href="#" data-page="tv" onclick="nav('tv')"><span>Live TV</span></a>
    <a href="#" data-page="search" onclick="nav('search')"><span>Search</span></a>
    <a href="#" data-page="downloads" onclick="nav('downloads')"><span>Downloads</span></a>
    <a href="#" data-page="settings" onclick="nav('settings')"><span>Settings</span></a>
  </nav>
  <div class="user-info">
    <div class="name" id="user-name"></div>
    <div id="user-mac"></div>
    <div id="user-exp"></div>
  </div>
</div>
<div id="main">

  <!-- VOD -->
  <div class="page active" id="page-vod">
    <div class="header">
      <h2 id="vod-title">VOD Library</h2>
      <select id="vod-cat" onchange="vodCatChange()"><option value="*">Loading...</option></select>
    </div>
    <div class="content" id="vod-list"></div>
    <div class="pagination" id="vod-pag"></div>
  </div>

  <!-- Live TV -->
  <div class="page" id="page-tv">
    <div class="header">
      <h2 id="tv-title">Live TV</h2>
      <select id="tv-genre" onchange="tvGenreChange()"><option value="*">Loading...</option></select>
    </div>
    <div class="content" id="tv-list"></div>
    <div class="pagination" id="tv-pag"></div>
  </div>

  <!-- Search -->
  <div class="page" id="page-search">
    <div class="header">
      <h2>Search VOD</h2>
      <input type="text" id="search-input" placeholder="Search movies, shows..." onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-accent" onclick="doSearch()">Search</button>
    </div>
    <div class="content" id="search-list"></div>
  </div>

  <!-- Downloads -->
  <div class="page" id="page-downloads">
    <div class="header">
      <h2>Downloads</h2>
      <div class="spacer"></div>
      <button class="btn btn-dim" onclick="loadDownloads()">Refresh</button>
    </div>
    <div class="content" id="dl-list"></div>
  </div>

  <!-- Settings -->
  <div class="page" id="page-settings">
    <div class="header"><h2>Settings</h2></div>
    <div class="content">
      <div class="settings-form" id="settings-form"></div>
      <div class="settings-status" id="settings-status"></div>
    </div>
  </div>

  <!-- Detail -->
  <div class="page" id="page-detail">
    <div class="detail-back"><button class="btn btn-dim" onclick="backFromDetail()">← Back</button></div>
    <div class="content">
      <div class="detail-hero">
        <div id="det-poster-wrap"></div>
        <div class="detail-hero-right">
          <div class="detail-title" id="det-title"></div>
          <div class="detail-grid" id="det-info"></div>
          <div class="detail-desc" id="det-desc"></div>
        </div>
      </div>
      <div class="series-browser" id="det-series" style="display:none"></div>
      <div class="detail-actions" id="det-actions"></div>
      <div class="fmt-info" id="det-codec-info" style="display:none"></div>
      <div class="qual-picker" id="det-qual-picker" style="display:none"></div>
      <div class="fmt-picker" id="det-fmt-picker" style="display:none"></div>
      <div class="fmt-hint" id="det-fmt-hint" style="display:none"></div>
      <div class="encoder-info" id="det-encoder-info" style="display:none"></div>
      <div class="sub-picker" id="det-sub-picker" style="display:none"></div>
      <div class="detail-status" id="det-status"></div>
      <div class="detail-url" id="det-url" style="display:none"></div>
    </div>
  </div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
